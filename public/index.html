<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Claude Orchestra</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-root"></div>
      <div id="sidebar-resize" title="Resize sidebar"></div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="topbar-left">
          <button id="btn-sidebar" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar"></button>
          <nav id="view-tabs" role="tablist"></nav>
        </div>
        <div id="topbar-right">
          <span id="alert-pill" hidden></span>
          <span id="conn-status" class="conn conn-connecting" title="Connecting"></span>
          <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings"></button>
        </div>
      </header>

      <div id="views">
        <section id="view-terminals" class="view" data-view="terminals"></section>
        <section id="view-supervision" class="view" data-view="supervision" hidden></section>
        <section id="view-approvals" class="view" data-view="approvals" hidden></section>
        <section id="view-race" class="view" data-view="race" hidden></section>
        <section id="view-digest" class="view" data-view="digest" hidden></section>
        <section id="view-launcher" class="view" data-view="launcher" hidden></section>
      </div>
    </main>
  </div>

  <div id="settings-root" class="panel-overlay" hidden></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>Claude Orchestra needs JavaScript to run a terminal.</noscript>

  <script nonce="__ORCHESTRA_NONCE__">window.__ORCHESTRA__ = __ORCHESTRA_BOOTSTRAP__;</script>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="/vendor/addon-search/lib/addon-search.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
